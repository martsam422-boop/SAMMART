
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMMART - Online Shopping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#102b5c;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#ffad32}
.cart{background:#ffad32;color:#111;padding:10px 16px;border-radius:7px;font-weight:bold}
.hero{background:linear-gradient(120deg,#102b5c,#1769aa);color:white;padding:45px 6%;text-align:center}
.hero h1{font-size:34px;margin-bottom:12px}
.hero p{font-size:16px;margin-bottom:20px}
.hero button{background:#ffad32;border:0;padding:12px 25px;border-radius:6px;font-weight:bold}
.search{padding:20px 5%;text-align:center}
.search input{width:100%;max-width:600px;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.categories{display:flex;gap:10px;overflow-x:auto;padding:10px 5% 20px}
.categories button{border:0;background:white;padding:12px 20px;border-radius:20px;white-space:nowrap;cursor:pointer}
.categories button.active{background:#102b5c;color:white}
.section{padding:15px 5% 35px}
.section h2{margin-bottom:20px;color:#102b5c}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px}
.product{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 9px #00000012;padding-bottom:15px}
.product img{width:100%;height:155px;object-fit:contain;background:#fff;padding:10px}
.product h3{font-size:15px;padding:5px 12px}
.price{color:#e87500;font-weight:bold;padding:5px 12px}
.product button{margin:8px 12px 0;background:#102b5c;color:white;border:0;padding:10px;border-radius:6px;width:calc(100% - 24px);cursor:pointer}
footer{background:#102b5c;color:white;text-align:center;padding:25px 12px;line-height:1.8}
.empty{text-align:center;padding:30px;color:#777;display:none}
</style>
</head>
<body>

<header>
  <div class="logo">SAMMART</div>
  <div class="cart">🛒 Cart: <span id="cartCount">0</span></div>
</header>

<section class="hero">
  <h1>Welcome to SAMMART</h1>
  <p>Your Online Shopping Destination in India</p>
  <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now</button>
</section>

<div class="search">
  <input id="searchBox" type="search" placeholder="Search products..." oninput="renderProducts()">
</div>

<div class="categories">
  <button class="active" onclick="setCategory('All',this)">All</button>
  <button onclick="setCategory('Electronics',this)">Electronics</button>
  <button onclick="setCategory('Fashion',this)">Fashion</button>
  <button onclick="setCategory('Home',this)">Home</button>
  <button onclick="setCategory('Accessories',this)">Accessories</button>
</div>

<section class="section" id="shop">
  <h2>Our Products</h2>
  <div class="products" id="products"></div>
  <div class="empty" id="empty">No products found.</div>
</section>

<footer>
  <h2>SAMMART</h2>
  <p>Online Shopping Made Easy</p>
  <p>India | Customer Support</p>
  <p>© 2026 SAMMART. All Rights Reserved.</p>
</footer>

<script>
const productList = [
 {id:1,name:"Wireless Headphones",price:799,category:"Electronics",image:"https://placehold.co/400x300?text=Headphones"},
 {id:2,name:"Smart Watch",price:1299,category:"Electronics",image:"https://placehold.co/400x300?text=Smart+Watch"},
 {id:3,name:"Men's T-Shirt",price:499,category:"Fashion",image:"https://placehold.co/400x300?text=T-Shirt"},
 {id:4,name:"Women's Handbag",price:899,category:"Fashion",image:"https://placehold.co/400x300?text=Handbag"},
 {id:5,name:"Table Lamp",price:599,category:"Home",image:"https://placehold.co/400x300?text=Lamp"},
 {id:6,name:"Water Bottle",price:299,category:"Home",image:"https://placehold.co/400x300?text=Bottle"},
 {id:7,name:"Sunglasses",price:399,category:"Accessories",image:"https://placehold.co/400x300?text=Sunglasses"},
 {id:8,name:"Backpack",price:999,category:"Accessories",image:"https://placehold.co/400x300?text=Backpack"}
];

let selectedCategory = "All";
let cartCount = 0;

function setCategory(category,button){
 selectedCategory=category;
 document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));
 button.classList.add('active');
 renderProducts();
}

function renderProducts(){
 const search=document.getElementById('searchBox').value.toLowerCase();
 const filtered=productList.filter(p=>
  (selectedCategory==="All" || p.category===selectedCategory) &&
  p.name.toLowerCase().includes(search)
 );

 const area=document.getElementById('products');
 area.innerHTML=filtered.map(p=>`
  <div class="product">
   <img src="${p.image}" alt="${p.name}">
   <h3>${p.name}</h3>
   <div class="price">₹${p.price.toLocaleString('en-IN')}</div>
   <button onclick="addToCart()">Add to Cart</button>
  </div>
 `).join('');

 document.getElementById('empty').style.display=filtered.length?'none':'block';
}

function addToCart(){
 cartCount++;
 document.getElementById('cartCount').textContent=cartCount;
 alert('Product added to cart!');
}

renderProducts();
</script>
</body>
</html>
